name: Impact comment

# The M4b exit criterion (lost-in-the/woods-map#4): a pull request that changes
# the rails-8.0 app gets one Markdown impact comment, rendered by Woods, whose
# focus link opens the Woods Map impact page with the changed template
# highlighted.
#
# The index is built the way a host app's CI would build it:
#   1. the base commit's index, from the cache or a full woods:extract;
#   2. the pull request's tree on top, with woods:incremental and an explicit
#      CHANGED_FILES (the container has no .git, so Woods cannot derive the range);
#   3. woods:impact over the two generations, which saves the report and
#      renders the Markdown. Nothing here diffs or summarises on its own.
on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/rails-8.0/**'
      - '.github/workflows/impact-comment.yml'
      - 'scripts/tools/impact_comment.rb'

# Read the checkout; write exactly one pull request comment.
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  VARIANT: rails-8.0
  # Where reviewers open the map. Set the repository variable WOODS_MAP_URL to a
  # shared deployment; the default is the testbed's own rails-8.0 port, which
  # reads the index artifact this run uploads.
  WOODS_MAP_URL: ${{ vars.WOODS_MAP_URL || 'http://localhost:3010/woods' }}

jobs:
  impact:
    name: Impact report (rails-8.0)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # The merge ref: the base tip plus this pull request, which is exactly the
      # tree the base index is compared against.
      - name: Check out the testbed
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: woods-testbed
          fetch-depth: 0

      - name: Check out the woods gem as a sibling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: lost-in-the/woods
          ref: main
          path: woods

      # rails-8.0 bundles the engine from ${WOODS_MAP_GEM_PATH:-../woods-map}.
      - name: Check out the Woods Map engine as a sibling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: lost-in-the/woods-map
          path: woods-map

      - name: Set up Ruby for the comment builder
        uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1
        with:
          ruby-version: '3.4'

      # Keep the builder this run tests: the base tree restored below may not
      # have it yet.
      - name: Stage the comment builder
        run: cp woods-testbed/scripts/tools/impact_comment.rb "$RUNNER_TEMP/impact_comment.rb"

      # --no-renames lists a rename as a deletion and an addition, so Woods
      # prunes the old unit as well as extracting the new one. Paths are
      # application-relative, which is what CHANGED_FILES expects.
      - name: Resolve the base, head and changed files
        id: range
        working-directory: woods-testbed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          head=$(git rev-parse HEAD)
          changed=$(git diff --name-only --no-renames "$BASE_SHA" "$head" -- "apps/$VARIANT" \
            | sed "s#^apps/$VARIANT/##" | grep -v '^tmp/' | paste -sd, - || true)
          woods=$(git -C ../woods rev-parse HEAD)
          {
            echo "base=$BASE_SHA"
            echo "head=$head"
            echo "woods=$woods"
            echo "changed=$changed"
          } >> "$GITHUB_OUTPUT"
          echo "base $BASE_SHA, head $head, woods $woods"
          echo "changed: ${changed:-none}"

      # Keyed by the base commit and the Woods revision: a different Woods may
      # publish a different index shape, and a different base is a different app.
      - name: Restore the base index
        id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: woods-testbed/apps/rails-8.0/tmp/woods
          key: impact-base-rails-8.0-${{ steps.range.outputs.base }}-woods-${{ steps.range.outputs.woods }}

      # Only the app's tree moves; the workflow and scripts stay at the merge ref.
      # `restore --worktree` also deletes files the base does not have.
      - name: Check out the base app tree
        working-directory: woods-testbed
        run: git restore --source="${{ steps.range.outputs.base }}" --staged --worktree -- "apps/$VARIANT"

      - name: Build and start the variant
        working-directory: woods-testbed
        run: |
          docker compose build "$VARIANT"
          docker compose up -d "$VARIANT"

      - name: Wait for boot
        run: |
          container="woods-testbed-$VARIANT"
          for i in $(seq 1 240); do
            if docker logs "$container" 2>&1 | grep -q "Listening on"; then
              echo "booted after ~$((i * 5))s"; exit 0
            fi
            if docker logs "$container" 2>&1 | grep -qE "Bundler::|Could not find|LoadError|Your Ruby version|aborted!|Gemfile specified|Could not locate Gemfile"; then
              echo "::error::boot failed — see the container log below"
              docker logs "$container" 2>&1 | tail -40
              exit 1
            fi
            [ $((i % 12)) -eq 0 ] && echo "  still booting (~$((i * 5))s): $(docker logs "$container" 2>&1 | tail -1)"
            sleep 5
          done
          echo "::error::timed out waiting for boot after 20 minutes"
          docker logs "$container" 2>&1 | tail -60
          exit 1

      # ModelExtractor drops a model whose table does not exist, so the schema
      # must be in place before either extraction.
      - name: Prepare the base database
        run: docker exec "woods-testbed-$VARIANT" bash -lc 'cd /app && bin/rails db:prepare'

      # GIT_SHA/GIT_BRANCH are honoured exactly when the root has no .git, which
      # is the container's case; without them the manifest records "unknown".
      - name: Extract the base (cache miss)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          docker exec -e GIT_SHA="${{ steps.range.outputs.base }}" -e GIT_BRANCH="${{ github.base_ref }}" \
            "woods-testbed-$VARIANT" bash -lc 'cd /app && bin/rails woods:clean && bin/rails woods:extract'

      # Root wrote the index inside the container; the runner must own it to
      # cache and upload it.
      - name: Take ownership of the base index
        run: sudo chown -R "$(id -u):$(id -g)" "woods-testbed/apps/$VARIANT/tmp"

      - name: Save the base index
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: woods-testbed/apps/rails-8.0/tmp/woods
          key: impact-base-rails-8.0-${{ steps.range.outputs.base }}-woods-${{ steps.range.outputs.woods }}

      - name: Record the base generation
        id: base
        run: echo "generation=$(jq -r .number "woods-testbed/apps/$VARIANT/tmp/woods/generation.json")" >> "$GITHUB_OUTPUT"

      # Bootsnap can serve a stale compile of a file just replaced over the bind
      # mount; clear it and pause before the next process boots.
      - name: Check out the pull request's app tree
        working-directory: woods-testbed
        run: |
          git restore --source="${{ steps.range.outputs.head }}" --staged --worktree -- "apps/$VARIANT"
          rm -rf "apps/$VARIANT/tmp/cache/bootsnap"
          sleep 2
          docker exec "woods-testbed-$VARIANT" bash -lc 'cd /app && bin/rails db:prepare'

      - name: Extract the pull request incrementally
        if: steps.range.outputs.changed != ''
        run: |
          docker exec -e GIT_SHA="${{ steps.range.outputs.head }}" -e GIT_BRANCH="${{ github.head_ref }}" \
            -e CHANGED_FILES="${{ steps.range.outputs.changed }}" \
            "woods-testbed-$VARIANT" bash -lc 'cd /app && bin/rails woods:incremental'
          sudo chown -R "$(id -u):$(id -g)" "woods-testbed/apps/$VARIANT/tmp"

      # Woods computes, saves and renders the report; the saved ID is what the
      # map's /impacts/<id> page reads.
      - name: Compute the impact report
        id: impact
        if: steps.range.outputs.changed != ''
        run: |
          head_gen=$(jq -r .number "woods-testbed/apps/$VARIANT/tmp/woods/generation.json")
          base_gen="${{ steps.base.outputs.generation }}"
          if [ "$head_gen" = "$base_gen" ]; then
            echo "::notice::woods:incremental published no new generation; the change touched nothing Woods indexes."
            echo "id=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          docker exec -e FORMAT=markdown -e WOODS_OUTPUT=/app/tmp/woods "woods-testbed-$VARIANT" \
            bash -lc "cd /app && bin/rails 'woods:impact[gen:$base_gen,gen:$head_gen]'" \
            > "$RUNNER_TEMP/impact.md" 2> "$RUNNER_TEMP/impact.err" || { cat "$RUNNER_TEMP/impact.err"; exit 1; }
          sudo chown -R "$(id -u):$(id -g)" "woods-testbed/apps/$VARIANT/tmp"
          id=$(grep -oE 'Saved impact report [0-9a-f]{64}' "$RUNNER_TEMP/impact.err" | awk '{print $4}')
          [ -n "$id" ] || { echo "::error::woods:impact printed no saved report ID"; cat "$RUNNER_TEMP/impact.err"; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "range gen:$base_gen → gen:$head_gen, saved report $id"

      - name: Build the comment
        if: steps.impact.outputs.id != ''
        env:
          REPORT_ID: ${{ steps.impact.outputs.id }}
          ARTIFACT: impact-index-${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ruby "$RUNNER_TEMP/impact_comment.rb" --markdown "$RUNNER_TEMP/impact.md" \
            --report "woods-testbed/apps/$VARIANT/tmp/woods/explorer/impacts/$REPORT_ID/impact.json" \
            --id "$REPORT_ID" --map-url "$WOODS_MAP_URL" --artifact "$ARTIFACT" --run-url "$RUN_URL" \
            > "$RUNNER_TEMP/comment.md"
          cat "$RUNNER_TEMP/comment.md" >> "$GITHUB_STEP_SUMMARY"

      # One comment per pull request, found by its marker and updated in place.
      # A fork's token cannot write comments; its report stays in the summary.
      - name: Post or update the comment
        if: steps.impact.outputs.id != '' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          marker='<!-- woods-impact-comment -->'
          existing=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq "map(select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\")))) | .[].id" | head -1)
          payload=$(jq -Rs '{body: .}' < "$RUNNER_TEMP/comment.md")
          if [ -n "$existing" ]; then
            echo "$payload" | gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" --input - --jq .html_url
          else
            echo "$payload" | gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --input - --jq .html_url
          fi

      # The index the focus link reads: download it into apps/rails-8.0/tmp/woods
      # and start rails-8.0 to open the link.
      - name: Upload the index
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: impact-index-${{ github.event.pull_request.number }}
          path: woods-testbed/apps/rails-8.0/tmp/woods
          retention-days: 14
          include-hidden-files: true
          if-no-files-found: warn
