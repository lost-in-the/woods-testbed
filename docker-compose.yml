name: woods-testbed

# Two Rails variants share this compose file. Bring one up at a time
# (or both — they bind to different ports and use separate bundle volumes).
#
#   docker compose up rails-8.0
#   docker compose up rails-7.2
#
# WOODS_GEM_PATH points at the woods gem checkout on the host. Default
# assumes the sibling-repo layout: woods-testbed and woods checked out
# next to each other under the same parent directory. Override when
# testing a worktree or another branch:
#
#   WOODS_GEM_PATH=/path/to/woods-worktree docker compose up rails-8.0
#
# Ports default to 3010 (Rails 8) and 3011 (Rails 7.2). Override with
# RAILS_8_PORT / RAILS_72_PORT if those conflict with something else.

x-common-env: &common-env
  RAILS_ENV: development
  WOODS_GEM_PATH: /woods-gem
  BUNDLE_SILENCE_ROOT_WARNING: "1"
  # Test-only bearer token for the HTTP Console MCP endpoint. The gem
  # refuses every guarded request with 401 until a 32+ character token is
  # set, so a fixed one here keeps the endpoint usable across variants.
  # Never reuse it outside the testbed.
  WOODS_CONSOLE_MCP_TOKEN: "woods-testbed-console-token-0123456789abcdef"

services:
  rails-8.0:
    build:
      context: ./apps/rails-8.0
    image: woods-testbed-rails-8.0
    container_name: woods-testbed-rails-8.0
    ports:
      - "${RAILS_8_PORT:-3010}:3000"
    volumes:
      - ./apps/rails-8.0:/app
      - ./scripts:/app/script/shared:ro
      - ${WOODS_GEM_PATH:-../woods}:/woods-gem:ro
      - bundle-rails-8:/bundle
    environment:
      <<: *common-env

  rails-7.2:
    build:
      context: ./apps/rails-7.2
    image: woods-testbed-rails-7.2
    container_name: woods-testbed-rails-7.2
    ports:
      - "${RAILS_72_PORT:-3011}:3000"
    volumes:
      - ./apps/rails-7.2:/app
      - ./scripts:/app/script/shared:ro
      - ${WOODS_GEM_PATH:-../woods}:/woods-gem:ro
      - bundle-rails-7-2:/bundle
    environment:
      <<: *common-env

  # Supported floor: Rails 6.0 on Ruby 3.0 (woods #135). Minimal backend-only
  # app — see apps/rails-6.0/README.md.
  rails-6.0:
    build:
      context: ./apps/rails-6.0
    image: woods-testbed-rails-6.0
    container_name: woods-testbed-rails-6.0
    ports:
      - "${RAILS_60_PORT:-3012}:3000"
    volumes:
      - ./apps/rails-6.0:/app
      - ./scripts:/app/script/shared:ro
      - ${WOODS_GEM_PATH:-../woods}:/woods-gem:ro
      - bundle-rails-6-0:/bundle
    environment:
      <<: *common-env

  # Scale variant (#2): large synthetic app for benchmarking incremental
  # latency, whole-app re-run cost, and daemon memory. Rails 8.0 only — it
  # exists to measure scale, not version behaviour.
  rails-8.0-large:
    build:
      context: ./apps/rails-8.0-large
    image: woods-testbed-rails-8.0-large
    container_name: woods-testbed-rails-8.0-large
    ports:
      - "${RAILS_8_LARGE_PORT:-3013}:3000"
    volumes:
      - ./apps/rails-8.0-large:/app
      - ./scripts:/app/script/shared:ro
      - ${WOODS_GEM_PATH:-../woods}:/woods-gem:ro
      - bundle-rails-8-large:/bundle
    environment:
      <<: *common-env

  # MySQL twin of rails-6.0: the only variant with a real mysql2 handle, so
  # backend-dialect contracts (gem PR lost-in-the/woods#248) reach a live
  # MySQL server through the production Console path. Rides the `backends`
  # profile — it cannot boot without the mysql service.
  rails-6.0-mysql:
    build:
      context: ./apps/rails-6.0-mysql
    image: woods-testbed-rails-6.0-mysql
    container_name: woods-testbed-rails-6.0-mysql
    profiles: [backends]
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${RAILS_60_MYSQL_PORT:-3014}:3000"
    volumes:
      - ./apps/rails-6.0-mysql:/app
      - ./scripts:/app/script/shared:ro
      - ${WOODS_GEM_PATH:-../woods}:/woods-gem:ro
      - bundle-rails-6-0-mysql:/bundle
    environment:
      <<: *common-env
      MYSQL_HOST: mysql

  # ── Storage + embedding backends (opt-in) ────────────────────────────────
  #
  # Behind the `backends` profile so the default `docker compose up` stays fast:
  #
  #   docker compose --profile backends up -d postgres qdrant mysql
  #
  # These exist because the testbed ran SQLite only, so nothing exercised the
  # gem's backend-agnostic claim end to end (woods-testbed#2 §1.3). Verified
  # runnable in a Claude Code session — see the plan's Appendix A.
  postgres:
    profiles: [backends]
    # pgvector's image, not plain postgres: the same container serves as the
    # primary database AND the vector store, which is the whole point of the
    # pgvector option.
    image: pgvector/pgvector:pg16
    container_name: woods-testbed-postgres
    environment:
      POSTGRES_PASSWORD: woods
      POSTGRES_DB: woods_testbed
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  qdrant:
    profiles: [backends]
    image: qdrant/qdrant:v1.19.0
    container_name: woods-testbed-qdrant
    ports:
      - "${QDRANT_PORT:-56333}:6333"

  # MySQL is the other half of the backend-agnostic claim, and the more
  # load-bearing half: MySQL has no pgvector equivalent, so a MySQL stack is
  # *forced* down the external-vector-store path (Qdrant). A testbed that only
  # ever runs PostgreSQL cannot catch a PostgreSQL-only assumption.
  mysql:
    profiles: [backends]
    image: mysql:8
    container_name: woods-testbed-mysql
    environment:
      MYSQL_ROOT_PASSWORD: woods
      MYSQL_DATABASE: woods_testbed
    ports:
      - "${MYSQL_PORT:-53306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -pwoods --silent"]
      interval: 4s
      timeout: 4s
      retries: 25

  # Redis: cache/queue backend for exercising gem paths that assume one.
  # Same opt-in profile as the storage backends above; app containers reach
  # it over the compose network as `redis`, the host port is for smoke runs.
  redis:
    profiles: [backends]
    image: redis:7-alpine
    container_name: woods-testbed-redis
    ports:
      - "${REDIS_PORT:-56379}:6379"

volumes:
  bundle-rails-8:
    name: woods-testbed-bundle-rails-8
  bundle-rails-7-2:
    name: woods-testbed-bundle-rails-7-2
  bundle-rails-6-0:
    name: woods-testbed-bundle-rails-6-0
  bundle-rails-8-large:
    name: woods-testbed-bundle-rails-8-large
  bundle-rails-6-0-mysql:
    name: woods-testbed-bundle-rails-6-0-mysql
