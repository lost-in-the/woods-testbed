version: 1
models:
  Article:
    associations: [author, publication, revisions, comments, tags, collections]
    columns: [publication_id, state, scheduled_at, lock_version, comments_count]
  Comment:
    associations: [article, parent, replies]
  Membership:
    associations: [organization, author]
  ActivityEvent:
    associations: [organization, actor, subject]
  Billing::Subscription:
    associations: [subscriber, plan, invoices, history]
  Billing::Payment:
    associations: [invoice, refunds]
  Newsletter::Delivery:
    associations: [campaign, subscriber, engagement_events]
  Support::Ticket:
    associations: [subscriber, assignee, subject, messages]
  Payouts::Payee:
    associations: [organization, profile, earnings, statements]
  Payouts::Earning:
    associations: [payee, source, statement]
    columns: [source_type, kind, amount_cents, earned_on]
  Payouts::Statement:
    associations: [payout_run, payee, earnings, transfer]
  Payouts::Transfer:
    associations: [statement]
    columns: [type, state, idempotency_key, attempts]
  Syndication::License:
    associations: [partner, article, granted_by, usage_reports]
units:
  - EditorialWorkflow
  - PublishArticle
  - Billing::SubscriptionWorkflow
  - Billing::CollectPayment
  - Billing::RefundPayment
  - Newsletter::SendCampaign
  - Support::ResolveTicket
  - PublishDueArticlesJob
  - Newsletter::DeliverJob
  - WebhookDeliveryJob
  - ArticlePolicy
  - ArticlesController
  - ArticleRevision
  - Payouts::AccrueEarning
  - Payouts::StartPayoutRun
  - Payouts::SubmitTransfer
  - Payouts::SubmitTransferJob
  - Syndication::GrantLicense
  - Syndication::RecordUsage
  - Api::V2::LicensesController
  - Payouts::StatementsController
retrieval:
  - question: Where is approval of a particular article revision enforced?
    pattern: EditorialWorkflow
    expected: EditorialWorkflow
  - question: What prevents duplicate payment attempts?
    pattern: CollectPayment
    expected: Billing::CollectPayment
  - question: What determines newsletter eligibility?
    pattern: Newsletter::Campaign
    expected: Newsletter::Campaign
  - question: Where is ownership of support tickets validated?
    pattern: Support::Ticket$
    expected: Support::Ticket
  - question: What stops a contributor statement from being paid twice?
    pattern: SubmitTransfer$
    expected: Payouts::SubmitTransfer
  - question: Where are conflicting exclusive syndication licenses refused?
    pattern: Syndication::License$
    expected: Syndication::License
# Independent answers for a fresh smoke fixture at its fixed reference time.
smoke_reports:
  canopy: { review_backlog: 3, overdue_cents: 12100, newsletter: { bounced: 3, delivered: 32 } }
  canopy-1: { review_backlog: 1, overdue_cents: 4800, newsletter: { bounced: 2, delivered: 15 } }
